<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Artworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fefcf8;
    --gold: #e4a83c;
    --rust: #d84818;
    --coral: #e49c90;
    --dim: #8c8377;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--paper); overflow:hidden; font-family:'Work Sans',sans-serif; }
  body { display:flex; align-items:center; justify-content:center; width:100vw; height:100vh; position:relative; }

  @media (prefers-reduced-motion: reduce) { .bloom { animation:none !important; opacity:0 !important; } }

  .stage { position:relative; width:min(96vw, 1200px); height:min(96vw, 1200px); display:flex; align-items:center; justify-content:center; }

  .bloom {
    position:absolute; top:50%; left:50%;
    opacity:0;
    transform:translate(-50%,-50%) scale(0.2) rotate(var(--rot,0deg));
    animation: bloom-out var(--dur,9s) ease-out infinite;
    animation-delay: var(--delay,0s);
  }
  .bloom svg { display:block; width:var(--size,140px); height:var(--size,140px); }

  @keyframes bloom-out {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(0.2) rotate(var(--rot,0deg)); }
    16%  { opacity:var(--peak,0.85); }
    55%  { opacity:var(--peak,0.85); }
    100% {
      opacity:0;
      transform:translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,0px)))
                scale(var(--end-scale,4)) rotate(calc(var(--rot,0deg) + 50deg));
    }
  }

  .mark { position:relative; z-index:5; text-align:center; animation: rise 1.4s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes rise { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  #logo-canvas { width:min(46vw, 420px); height:auto; display:block; margin:0 auto; }
</style>
</head>
<body>
  <div class="stage">

    <!-- Rounded star/square hybrid shapes + dots, sized down and randomised so
         shape type no longer correlates with which side of the screen it appears on -->
    <div class="bloom" style="--delay:0s;   --dur:9s;   --size:75px; --tx:320px;  --ty:300px;  --rot:0deg;   --end-scale:3.8; --peak:0.9;">
      <svg viewBox="0 0 100 100"><path fill="#e4a83c" d="M50,2 C57,25 67,38 88,50 C67,62 57,75 50,98 C43,75 33,62 12,50 C33,38 43,25 50,2 Z"/></svg>
    </div>
    <div class="bloom" style="--delay:1.1s; --dur:10s;  --size:65px; --tx:-360px; --ty:-260px; --rot:15deg;  --end-scale:4.2; --peak:0.85;">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#d84818"/></svg>
    </div>
    <div class="bloom" style="--delay:2.2s; --dur:8.5s; --size:22px; --tx:400px;  --ty:0px;    --rot:-10deg; --end-scale:5.2; --peak:0.8;">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#e49c90"/></svg>
    </div>
    <div class="bloom" style="--delay:3.3s; --dur:9.5s; --size:50px; --tx:-420px; --ty:20px;   --rot:8deg;   --end-scale:4;   --peak:0.9;">
      <svg viewBox="0 0 100 100"><path fill="#d84818" d="M50,2 C57,25 67,38 88,50 C67,62 57,75 50,98 C43,75 33,62 12,50 C33,38 43,25 50,2 Z"/></svg>
    </div>
    <div class="bloom" style="--delay:4.5s; --dur:9.8s; --size:35px; --tx:340px;  --ty:-200px; --rot:6deg;   --end-scale:4.6; --peak:0.75;">
      <svg viewBox="0 0 100 100"><path fill="#e49c90" d="M50,2 C57,25 67,38 88,50 C67,62 57,75 50,98 C43,75 33,62 12,50 C33,38 43,25 50,2 Z"/></svg>
    </div>
    <div class="bloom" style="--delay:5.6s; --dur:10.5s;--size:45px; --tx:0px;    --ty:-380px; --rot:20deg;  --end-scale:4.1; --peak:0.85;">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#e4a83c"/></svg>
    </div>
    <div class="bloom" style="--delay:6.7s; --dur:9.2s; --size:30px; --tx:-60px;  --ty:400px;  --rot:-16deg; --end-scale:4.6; --peak:0.8;">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#e4a83c"/></svg>
    </div>
    <div class="bloom" style="--delay:7.8s; --dur:8.8s; --size:27px; --tx:-300px; --ty:280px;  --rot:-10deg; --end-scale:5;   --peak:0.8;">
      <svg viewBox="0 0 100 100"><path fill="#e4a83c" d="M50,2 C57,25 67,38 88,50 C67,62 57,75 50,98 C43,75 33,62 12,50 C33,38 43,25 50,2 Z"/></svg>
    </div>

    <!-- Sprite-sheet canvas player: true alpha transparency, no video codec issues -->
    <div class="mark">
      <canvas id="logo-canvas" width="300" height="400"></canvas>
    </div>
  </div>

  <script>
    // Sprite sheet config — matches how logo-sprite-v3.png was packed
    const SPRITE_SRC = 'https://adwluvwvemzrfpgukhtc.supabase.co/storage/v1/object/public/website-assets/logo-sprite-v3.png';
    const COLS = 10, ROWS = 10, TOTAL_FRAMES = 100;
    const FRAME_W = 300, FRAME_H = 400;
    const FPS = 24;

    const canvas = document.getElementById('logo-canvas');
    const ctx = canvas.getContext('2d');
    const sprite = new Image();
    sprite.src = SPRITE_SRC;

    let currentFrame = 0;
    let lastTime = 0;
    const frameDuration = 1000 / FPS;

    function drawFrame(i) {
      const col = i % COLS;
      const row = Math.floor(i / COLS);
      ctx.clearRect(0, 0, FRAME_W, FRAME_H);
      ctx.drawImage(
        sprite,
        col * FRAME_W, row * FRAME_H, FRAME_W, FRAME_H,
        0, 0, FRAME_W, FRAME_H
      );
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const elapsed = timestamp - lastTime;
      if (elapsed >= frameDuration) {
        drawFrame(currentFrame);
        currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
        lastTime = timestamp;
      }
      requestAnimationFrame(loop);
    }

    sprite.onload = () => requestAnimationFrame(loop);
  </script>
</body>
</html>
