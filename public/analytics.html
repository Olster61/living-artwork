<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Living Artwork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:    #c9a84c;
      --bg:      #0d0d0d;
      --bg2:     #141414;
      --bg3:     #1c1c1c;
      --border:  rgba(255,255,255,0.07);
      --text1:   #e8e8e8;
      --text2:   #999;
      --text3:   #555;
      --mobile:  #4ecdc4;
      --tablet:  #c9a84c;
      --desktop: #7c6fcd;
      --green:   #4ade80;
      --red:     #f87171;
      --orange:  #fb923c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text1);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px; height: 52px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .nav-logo  { font-weight: 600; font-size: 14px; color: var(--text1); }
    .nav-sep   { flex: 1; }
    .back-btn  {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px; color: var(--text2);
      font-size: 12px; font-family: 'Inter', system-ui, sans-serif;
      cursor: pointer; text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    .back-btn:hover { border-color: rgba(255,255,255,.2); color: var(--text1); }

    /* ── Layout ── */
    .page    { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }
    h1       { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .subtitle{ color: var(--text2); font-size: 12px; margin-bottom: 28px; }

    /* ── Section ── */
    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 11px; font-weight: 600;
      color: var(--text3); text-transform: uppercase;
      letter-spacing: .1em; margin-bottom: 12px;
    }
    .panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    /* ── Funnel ── */
    .funnel {
      display: flex; align-items: stretch;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .f-step {
      flex: 1; padding: 20px 16px;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 4px;
    }
    .f-step:last-child { border-right: none; }
    .f-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
    .f-count { font-size: 28px; font-weight: 600; line-height: 1; color: var(--text1); }
    .f-count.gold   { color: var(--gold); }
    .f-count.green  { color: var(--green); }
    .f-sub   { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .f-drop  { font-size: 11px; color: var(--red); margin-top: 2px; }
    @media (max-width: 640px) {
      .funnel { flex-direction: column; }
      .f-step { border-right: none; border-bottom: 1px solid var(--border); }
      .f-step:last-child { border-bottom: none; }
    }

    /* ── Bar rows ── */
    .bar-row {
      display: grid;
      grid-template-columns: 140px 1fr 50px;
      align-items: center; gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .bar-row:last-child { border-bottom: none; }
    .bar-label { font-size: 12px; color: var(--text1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { background: rgba(255,255,255,.05); border-radius: 3px; height: 6px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; background: var(--gold); transition: width .4s ease; }
    .bar-fill.mobile      { background: var(--mobile); }
    .bar-fill.tablet      { background: var(--tablet); }
    .bar-fill.desktop     { background: var(--desktop); }
    .bar-fill.fail-cam    { background: var(--red); }
    .bar-fill.fail-gum    { background: var(--orange); }
    .bar-fill.fail-script { background: var(--red); }
    .bar-fill.fail-closed { background: var(--text3); }
    .bar-count { font-size: 12px; color: var(--text2); text-align: right; }

    /* ── Per-artwork table ── */
    table  { width: 100%; border-collapse: collapse; }
    th {
      font-size: 10px; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: .08em;
      text-align: left; padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 9px 14px; font-size: 12px; color: var(--text2);
      border-bottom: 1px solid var(--border);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.artwork-slug { font-family: monospace; color: var(--text1); font-size: 12px; }

    /* ── Badges ── */
    .badge {
      display: inline-block; padding: 2px 7px;
      border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: .04em;
    }
    .badge-mobile  { background: rgba(78,205,196,.15);  color: var(--mobile); }
    .badge-tablet  { background: rgba(201,168,76,.15);  color: var(--tablet); }
    .badge-desktop { background: rgba(124,111,205,.15); color: var(--desktop); }
    .badge-yes     { background: rgba(74,222,128,.15);  color: var(--green); }
    .badge-no      { background: rgba(255,255,255,.05); color: var(--text3); }
    .badge-warn    { background: rgba(240,192,96,.15);  color: var(--gold); }
    .badge-fail-cam    { background: rgba(248,113,113,.15); color: var(--red); }
    .badge-fail-gum    { background: rgba(251,146,60,.15);  color: var(--orange); }
    .badge-fail-script { background: rgba(248,113,113,.15); color: var(--red); }
    .badge-fail-closed { background: rgba(255,255,255,.05); color: var(--text3); }

    /* ── Two-col ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    .filter-bar select,
    .filter-bar input[type="date"] {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text2);
      font-size: 12px;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 5px 10px;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }
    .filter-bar select:focus,
    .filter-bar input[type="date"]:focus { border-color: rgba(255,255,255,.2); color: var(--text1); }
    .filter-bar input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.5); cursor: pointer; }
    .filter-label { font-size: 11px; color: var(--text3); }
    .filter-clear {
      padding: 5px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text3); font-size: 11px;
      font-family: 'Inter', system-ui, sans-serif;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .filter-clear:hover { border-color: rgba(255,255,255,.2); color: var(--text2); }
    .filter-count { font-size: 11px; color: var(--text3); margin-left: auto; }

    /* ── Spinner ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">Living Artwork</div>
  <span style="font-size:11px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;">Visitor Analytics</span>
  <div class="nav-sep"></div>
  <a href="/olly/admin" class="back-btn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg>
    Admin
  </a>
</nav>

<div class="page">
  <h1>Analytics</h1>
  <div class="subtitle" id="subtitle">Loading…</div>
  <div id="root"><div class="spinner"></div></div>
</div>

<script>
async function load() {
  const res = await fetch('/api/analytics/summary')
  if (!res.ok) {
    document.getElementById('root').innerHTML =
      `<p style="color:var(--red)">Failed to load analytics: HTTP ${res.status}</p>`
    return
  }
  const { rows } = await res.json()

  document.getElementById('subtitle').textContent =
    `Last ${Math.min(rows.length, 1000).toLocaleString()} visits · updates on refresh`

  // ── Option lists for filter dropdowns ──────────────────────────
  const uniq = (fn) => [...new Set(rows.map(fn).filter(Boolean))].sort()
  const allDevices  = uniq(r => r.device_type)
  const allOses     = uniq(r => r.os_name)
  const allBrowsers = uniq(r => r.browser_name)
  const allArtworks = uniq(r => r.artwork_slug)

  // ── Filter state ────────────────────────────────────────────────
  let fDevice = '', fOS = '', fBrowser = '', fArtwork = '', fFrom = '', fTo = ''

  function getFiltered() {
    return rows.filter(r => {
      if (fDevice  && r.device_type  !== fDevice)  return false
      if (fOS      && r.os_name      !== fOS)       return false
      if (fBrowser && r.browser_name !== fBrowser)  return false
      if (fArtwork && r.artwork_slug !== fArtwork)  return false
      if (fFrom    && r.created_at < fFrom)         return false
      if (fTo      && r.created_at > fTo + 'T23:59:59Z') return false
      return true
    })
  }

  // ── Aggregation helpers ─────────────────────────────────────────
  function pct(n, d) { return d ? Math.round(n / d * 100) : 0 }

  function funnelOf(data) {
    return {
      visits:     data.length,
      scanner:    data.filter(r => r.scanner_loaded).length,
      recognized: data.filter(r => r.artwork_recognized).length,
      played:     data.filter(r => r.animation_played).length,
    }
  }

  function perArtworkOf(data) {
    const map = {}
    for (const r of data) {
      if (!r.artwork_slug) continue
      if (!map[r.artwork_slug]) map[r.artwork_slug] = { recognized: 0, played: 0 }
      if (r.artwork_recognized) map[r.artwork_slug].recognized++
      if (r.animation_played)   map[r.artwork_slug].played++
    }
    return Object.entries(map)
      .map(([slug, s]) => ({ slug, ...s }))
      .sort((a, b) => b.recognized - a.recognized)
  }

  function breakdownsOf(data) {
    const devices = {}, browsers = {}, oses = {}, failures = {}
    for (const r of data) {
      const dk = r.device_type || 'unknown'
      const bk = `${r.browser_name || 'Other'} ${r.browser_version || ''}`.trim()
      const ok = `${r.os_name || 'Other'} ${r.os_version || ''}`.trim()
      devices[dk]  = (devices[dk]  || 0) + 1
      browsers[bk] = (browsers[bk] || 0) + 1
      oses[ok]     = (oses[ok]     || 0) + 1
      if (r.failure_reason) failures[r.failure_reason] = (failures[r.failure_reason] || 0) + 1
    }
    const toArr = obj => Object.entries(obj)
      .map(([label, count]) => ({ label, count }))
      .sort((a, b) => b.count - a.count)
    return { devices: toArr(devices), browsers: toArr(browsers), oses: toArr(oses), failures: toArr(failures) }
  }

  // ── Render helpers ──────────────────────────────────────────────
  function barFillClass(label) {
    const l = (label || '').toLowerCase()
    if (l === 'mobile')  return 'mobile'
    if (l === 'tablet')  return 'tablet'
    if (l === 'desktop') return 'desktop'
    return ''
  }
  function failFillClass(reason) {
    if (reason === 'camera_permission_denied') return 'fail-cam'
    if (reason === 'getUserMedia_unsupported')  return 'fail-gum'
    if (reason === 'user_closed_before_load')   return 'fail-closed'
    return 'fail-script'
  }
  function failBadge(reason) {
    const map = {
      camera_permission_denied: ['badge-fail-cam',    'Cam Denied'],
      getUserMedia_unsupported:  ['badge-fail-gum',    'No Camera API'],
      script_render_error:       ['badge-fail-script', 'Script Error'],
      user_closed_before_load:   ['badge-fail-closed', 'Closed Early'],
    }
    const [cls, txt] = map[reason] || ['badge-fail-script', reason]
    return `<span class="badge ${cls}" title="${reason}">${txt}</span>`
  }
  function devBadge(d) {
    return `<span class="badge badge-${(d||'').toLowerCase()}">${d || '?'}</span>`
  }
  function boolBadge(val, warnCls) {
    if (val === true)  return `<span class="badge ${warnCls || 'badge-yes'}">Yes</span>`
    if (val === false) return `<span class="badge badge-no">No</span>`
    return `<span class="badge badge-no">—</span>`
  }
  function fmtDate(ts) {
    if (!ts) return '—'
    const d = new Date(ts)
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' +
           d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
  }
  function barRows(items, maxCount, colorFn) {
    return items.map(({ label, count }) => `
      <div class="bar-row">
        <div class="bar-label" title="${label}">${label}</div>
        <div class="bar-track">
          <div class="bar-fill ${colorFn ? colorFn(label) : ''}"
               style="width:${Math.round(count / maxCount * 100)}%"></div>
        </div>
        <div class="bar-count">${count}</div>
      </div>`).join('')
  }

  // ── Funnel HTML ─────────────────────────────────────────────────
  function funnelHtml(f) {
    const scanDrop  = f.visits     ? 100 - pct(f.scanner,    f.visits)     : 0
    const recDrop   = f.scanner    ? 100 - pct(f.recognized, f.scanner)    : 0
    const playDrop  = f.recognized ? 100 - pct(f.played,     f.recognized) : 0
    return `
      <div class="funnel">
        <div class="f-step">
          <div class="f-label">Total Visits</div>
          <div class="f-count">${f.visits.toLocaleString()}</div>
          <div class="f-sub">all sessions</div>
        </div>
        <div class="f-step">
          <div class="f-label">Scanner Loaded</div>
          <div class="f-count gold">${pct(f.scanner, f.visits)}%</div>
          <div class="f-sub">${f.scanner.toLocaleString()} visitors</div>
          ${scanDrop ? `<div class="f-drop">−${scanDrop}% dropped</div>` : ''}
        </div>
        <div class="f-step">
          <div class="f-label">Artwork Recognized</div>
          <div class="f-count gold">${pct(f.recognized, f.visits)}%</div>
          <div class="f-sub">${f.recognized.toLocaleString()} scans</div>
          ${recDrop ? `<div class="f-drop">−${recDrop}% of scanner</div>` : ''}
        </div>
        <div class="f-step">
          <div class="f-label">Animation Played</div>
          <div class="f-count green">${pct(f.played, f.visits)}%</div>
          <div class="f-sub">${f.played.toLocaleString()} viewers</div>
          ${playDrop ? `<div class="f-drop">−${playDrop}% of recognized</div>` : ''}
        </div>
      </div>`
  }

  // ── Per-artwork HTML ────────────────────────────────────────────
  function perArtworkHtml(items) {
    if (!items.length) return `<div class="panel" style="padding:20px;color:var(--text3)">No artwork scans recorded yet.</div>`
    const trs = items.map(a => `
      <tr>
        <td class="artwork-slug">${a.slug}</td>
        <td class="num">${a.recognized.toLocaleString()}</td>
        <td class="num">${a.played.toLocaleString()}</td>
        <td class="num">${pct(a.played, a.recognized)}%</td>
      </tr>`).join('')
    return `
      <div class="panel" style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Artwork</th>
              <th style="text-align:right">Recognized</th>
              <th style="text-align:right">Animation Played</th>
              <th style="text-align:right">Play Rate</th>
            </tr>
          </thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`
  }

  // ── Recent visits HTML ──────────────────────────────────────────
  function recentHtml(filtered) {
    const shown = filtered.slice(0, 100)
    if (!shown.length) {
      return `<tr><td colspan="9" style="color:var(--text3);text-align:center;padding:20px">No matching visits</td></tr>`
    }
    return shown.map(r => `
      <tr>
        <td>${fmtDate(r.created_at)}</td>
        <td>${devBadge(r.device_type)}</td>
        <td>${r.browser_name || '—'} ${r.browser_version || ''}</td>
        <td>${r.os_name || '—'} ${r.os_version || ''}</td>
        <td>${r.artwork_slug ? `<code style="color:var(--text1)">${r.artwork_slug}</code>` : '—'}</td>
        <td>${boolBadge(r.scanner_loaded)}</td>
        <td>${boolBadge(r.artwork_recognized)}</td>
        <td>${boolBadge(r.animation_played, 'badge-yes')}</td>
        <td>${r.failure_reason ? failBadge(r.failure_reason) : '—'}</td>
      </tr>`).join('')
  }

  // ── Filter bar HTML ─────────────────────────────────────────────
  function selectHtml(id, label, options, val) {
    const opts = [`<option value="">All ${label}s</option>`,
      ...options.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`)
    ].join('')
    return `<select id="${id}">${opts}</select>`
  }

  // ── Initial render + wiring ─────────────────────────────────────
  function renderAll() {
    const filtered = getFiltered()
    const f   = funnelOf(rows)             // global funnel
    const pa  = perArtworkOf(rows)         // global per-artwork
    const bd  = breakdownsOf(rows)         // global breakdowns
    const maxDev  = bd.devices[0]?.count  || 1
    const maxBrow = bd.browsers[0]?.count || 1
    const maxOs   = bd.oses[0]?.count     || 1
    const maxFail = bd.failures[0]?.count || 1

    document.getElementById('root').innerHTML = `
      <div class="section">
        <div class="section-title">AR Funnel</div>
        ${funnelHtml(f)}
      </div>

      <div class="section">
        <div class="section-title">Per-Artwork Breakdown</div>
        ${perArtworkHtml(pa)}
      </div>

      ${bd.failures.length ? `
      <div class="section">
        <div class="section-title">AR Failure Reasons</div>
        <div class="panel">${barRows(bd.failures, maxFail, failFillClass)}</div>
      </div>` : ''}

      <div class="two-col">
        <div class="section">
          <div class="section-title">Device Type</div>
          <div class="panel">${barRows(bd.devices, maxDev, barFillClass)}</div>
        </div>
        <div class="section">
          <div class="section-title">Operating System</div>
          <div class="panel">${barRows(bd.oses, maxOs)}</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Browser</div>
        <div class="panel">${barRows(bd.browsers, maxBrow)}</div>
      </div>

      <div class="section">
        <div class="section-title">Recent Visits (last 100 matching)</div>

        <div class="filter-bar">
          ${selectHtml('f-device',  'Device',  allDevices,  fDevice)}
          ${selectHtml('f-os',      'OS',      allOses,     fOS)}
          ${selectHtml('f-browser', 'Browser', allBrowsers, fBrowser)}
          ${selectHtml('f-artwork', 'Artwork', allArtworks, fArtwork)}
          <input type="date" id="f-from" value="${fFrom}" title="From date">
          <input type="date" id="f-to"   value="${fTo}"   title="To date">
          <button class="filter-clear" id="f-clear">Clear</button>
          <span class="filter-count" id="f-count"></span>
        </div>

        <div class="panel" style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Time</th><th>Device</th><th>Browser</th><th>OS</th>
                <th>Artwork</th><th>Scanner</th><th>Recognized</th><th>Animation</th><th>Failure</th>
              </tr>
            </thead>
            <tbody id="recent-body"></tbody>
          </table>
        </div>
      </div>
    `

    // Initial recent render
    renderRecent()

    // Wire up filters
    for (const id of ['f-device', 'f-os', 'f-browser', 'f-artwork']) {
      document.getElementById(id).addEventListener('change', e => {
        if (id === 'f-device')  fDevice  = e.target.value
        if (id === 'f-os')      fOS      = e.target.value
        if (id === 'f-browser') fBrowser = e.target.value
        if (id === 'f-artwork') fArtwork = e.target.value
        renderRecent()
      })
    }
    document.getElementById('f-from').addEventListener('change', e => { fFrom = e.target.value; renderRecent() })
    document.getElementById('f-to').addEventListener('change',   e => { fTo   = e.target.value; renderRecent() })
    document.getElementById('f-clear').addEventListener('click', () => {
      fDevice = fOS = fBrowser = fArtwork = fFrom = fTo = ''
      document.getElementById('f-device').value  = ''
      document.getElementById('f-os').value      = ''
      document.getElementById('f-browser').value = ''
      document.getElementById('f-artwork').value = ''
      document.getElementById('f-from').value    = ''
      document.getElementById('f-to').value      = ''
      renderRecent()
    })
  }

  function renderRecent() {
    const filtered = getFiltered()
    document.getElementById('f-count').textContent =
      filtered.length !== rows.length ? `${filtered.length} of ${rows.length} visits` : `${rows.length} visits`
    document.getElementById('recent-body').innerHTML = recentHtml(filtered)
  }

  renderAll()
}

load().catch(err => {
  document.getElementById('root').innerHTML =
    `<p style="color:var(--red)">${err.message}</p>`
})
</script>
</body>
</html>
