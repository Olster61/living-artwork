name: Keep Supabase alive

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/visitor_analytics?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase replied with status $status"
          cat response.txt
          [ "$status" = "200" ]
